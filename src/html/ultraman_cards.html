<script>
/* ==========================================================================
   资源根地址：默认采用「当前页面所在域名」的同源相对路径 './info/'，
   因此无论用局域网 IP（http://192.168.1.2:35537/）还是花生壳域名
   （http://58879wfav850.vicp.fun/）打开，都会自动向「当前域名」请求数据，
   内/外网通用，无需手动切换，也不会因为浏览器记忆了旧地址而串味。
   仅当需要临时指向另一台服务器时，用 URL 参数：xxx.html?base=http://x.x.x.x:port
   （仅本次访问生效，不做任何本地记忆）
   ========================================================================== */
const RES_BASE = (() => {
  const q = new URLSearchParams(location.search).get('base');
  if (q && q.trim()) return q.trim().replace(/\/+$/, '');   // 临时覆盖，单次生效，不记忆
  return '';                                                // 空 → 同源相对路径（默认，内/外网通用）
})();

/* 统一的资源 URL 构造：所有图片 / 音频 / JSON 都必须经由此函数 */
const resUrl = (p) => (RES_BASE ? RES_BASE.replace(/\/+$/, '') + '/info/' : './info/') + String(p || '').replace(/^\/+/, '');

const DATA_URL = resUrl('metainfo.json');
const JUSTFOR = 'Dazhizi';
let HEROES = [];

/* ---------- 数据填充（沿用原逻辑） ---------- */
function populateCard(hero, p) {
  const set = (id, val) => { const el = document.getElementById(p + id); if (el) el.textContent = val; };
  const setHTML = (id, val) => { const el = document.getElementById(p + id); if (el) el.innerHTML = val; };
  set('tcgNameCn', hero.cn);
  set('tcgHeight', hero.height);
  set('tcgWeight', hero.weight);
  set('tcgSpeed', hero.speed);
  set('tcgAge', hero.age);
  set('tcgEffect', '【' + hero.skill + '】' + hero.weapon + ' · ' + hero.transform_item);
  set('tcgNo', 'NO.' + String(hero.index).padStart(3, '0'));
  set('tcgJustfor', '@' + JUSTFOR);
  set('tcgRarity', '★'.repeat(hero.rarity) + '☆'.repeat(5 - hero.rarity));
  set('collectEnName', hero.en);
  set('collectEnSub', hero.works);
  set('collectCnSub', hero.cn);
  setHTML('collectWorks', '<span style="color:#aaa;">来自</span> ' + hero.home);
}

/* ---------- 背面聚光灯（作用域 = 整张卡片） ---------- */
function initSpotlight(p) {
  // 基准容器由 .collect-img 改为 .card-collect：坐标换算与鼠标跟随范围覆盖整张卡片
  const cardRoot = document.getElementById(p + 'cardCollect');
  const mask = document.getElementById(p + 'spotlightMask');
  const glow = document.getElementById(p + 'spotlightGlow');
  const flashlightBtn = document.getElementById(p + 'flashlightBtn');
  if (!cardRoot || !mask || !glow) return;
  let isAnimating = false, spotlightActive = false, animFrame = null;
  function setSpotlight(px, py) {
    mask.style.background = `radial-gradient(circle 50px at ${px}% ${py}%, rgba(240,238,237,0) 0%, rgba(100,95,90,0.5) 55%, rgba(40,35,32,0.85) 100%)`;
    glow.style.opacity = '1'; glow.style.top = py + '%'; glow.style.left = px + '%';
  }
  function updateSpotlight(x, y) {
    if (isAnimating || !spotlightActive) return;
    const rect = cardRoot.getBoundingClientRect();
    setSpotlight(((x - rect.left) / rect.width) * 100, ((y - rect.top) / rect.height) * 100);
  }
  function playFlashlightShake() {
    isAnimating = true; spotlightActive = true;
    const startTime = performance.now(), shakeDuration = 5000, pauseDuration = 500, cx = 50, cy = 50;
    // 巡游路径纵向扩展到 10%~90%，让光束扫过标题栏与底部信息区，而非只在图片区来回
    const waypoints = [{x:50,y:50},{x:30,y:16},{x:70,y:74},{x:22,y:38},{x:56,y:11},{x:78,y:62},{x:16,y:56},{x:64,y:24},{x:42,y:88},{x:74,y:40},{x:26,y:70},{x:52,y:44},{x:50,y:50}];
    function animateShake(now) {
      const elapsed = now - startTime;
      if (elapsed >= shakeDuration) { setSpotlight(cx, cy); setTimeout(startExpand, pauseDuration); return; }
      const progress = elapsed / shakeDuration, segCount = waypoints.length - 1;
      const rawIdx = progress * segCount, idx = Math.floor(rawIdx), t = rawIdx - idx;
      const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      const wp0 = waypoints[Math.min(idx, segCount)], wp1 = waypoints[Math.min(idx + 1, segCount)];
      setSpotlight(wp0.x + (wp1.x - wp0.x) * ease, wp0.y + (wp1.y - wp0.y) * ease);
      animFrame = requestAnimationFrame(animateShake);
    }
    animFrame = requestAnimationFrame(animateShake);
  }
  function startExpand() {
    glow.classList.remove('expanding'); mask.classList.remove('expanding'); void glow.offsetWidth;
    glow.classList.add('expanding'); mask.classList.add('expanding');
    setTimeout(function() {
      glow.classList.remove('expanding'); mask.classList.remove('expanding');
      mask.style.background = 'transparent'; mask.style.opacity = '1';
      glow.style.opacity = '1'; glow.style.width = '70px'; glow.style.height = '70px';
      isAnimating = false; spotlightActive = false;
    }, 5100);
  }
  cardRoot.addEventListener('mousemove', e => updateSpotlight(e.clientX, e.clientY));
  cardRoot.addEventListener('mouseleave', () => { if (!isAnimating && !spotlightActive) return; setSpotlight(50, 50); });
  if (flashlightBtn) flashlightBtn.addEventListener('click', e => {
    e.stopPropagation(); if (isAnimating) return;
    flashlightBtn.classList.add('active'); playFlashlightShake();
    setTimeout(() => flashlightBtn.classList.remove('active'), 10500);
  });
}

/* ---------- 背面 🔊 小喇叭音效 ---------- */
function initAudio(p, audioList, card) {
  const speakerBtn = document.getElementById(p + 'speakerBtn');
  if (!speakerBtn) return;
  if (!audioList || !audioList.length) { speakerBtn.style.display = 'none'; return; }  // 无音频则隐藏按钮
  const audioEl = new Audio();
  audioEl.preload = 'auto';
  let idx = 0, timer = null;
  // A4：成为顶卡时由 refreshImageWindow 在空闲时段预热第一段，点击即播无需等待
  if (card) card._audioPreheat = () => { if (!audioEl.src) audioEl.src = resUrl(audioList[idx % audioList.length]); };
  speakerBtn.addEventListener('click', e => {
    e.stopPropagation();                       // 不触发卡片翻转/拖拽
    speakerBtn.classList.add('active');
    audioEl.src = resUrl(audioList[idx % audioList.length]);   // 多段音频循环播放（统一走 resUrl）
    idx++;
    try { audioEl.currentTime = 0; } catch (_) {}
    const pr = audioEl.play();
    if (pr && pr.catch) pr.catch(err => console.warn('音频播放失败:', err));
    clearTimeout(timer);
    timer = setTimeout(() => speakerBtn.classList.remove('active'), 1200);
  });
}

/* ---------- 堆叠滑动 ---------- */
let deck = [];   // deck[0] = 当前顶部英雄索引；在 boot() 中按 JSON 长度初始化
const STACK = 4;
const THRESHOLD = 90;
const FLY = 380;
let dragging = false, startX = 0, startY = 0, dragX = 0, dragY = 0, moved = 0, locked = false;
const stackArea = document.getElementById('stackArea');
const counterEl = document.getElementById('counter');
const dotsEl = document.getElementById('dots');

function cardEl(idx) { return document.getElementById('c' + (idx + 1) + '_flipCard'); }
function topCardEl() { return cardEl(deck[0]); }

function applyStack() {
  deck.forEach((heroIdx, pos) => {
    const card = cardEl(heroIdx);
    if (!card) return;
    if (pos >= STACK) { card.style.display = 'none'; return; }
    card.style.display = '';
    const scale = 1 - pos * 0.05;
    const y = pos * 16;
    const rot = pos === 0 ? 0 : (pos % 2 === 0 ? pos * 2.5 : -pos * 2.5);
    card.style.transform = `translateY(${y}px) scale(${scale}) rotate(${rot}deg)`;
    card.style.zIndex = 100 - pos;
    card.style.opacity = '1';
    card.style.boxShadow = pos === 0
      ? '0 24px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06)'
      : `0 ${14 - pos*2}px ${26 - pos*4}px rgba(0,0,0,0.4)`;
    card.style.transition = 'transform 360ms cubic-bezier(0.34,1.4,0.64,1), opacity 300ms ease, box-shadow 0.1s';
    card.style.pointerEvents = pos === 0 ? 'auto' : 'none';
    card.style.cursor = pos === 0 ? 'grab' : 'default';
    if (pos !== 0) card.classList.remove('flipped');   // 仅顶部可翻转
    const bp = card.querySelector('.badge-prev'), bn = card.querySelector('.badge-next');
    if (bp) bp.style.opacity = '0';
    if (bn) bn.style.opacity = '0';
  });
  counterEl.textContent = (deck[0] + 1) + ' / ' + HEROES.length;
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === deck[0]));
  refreshImageWindow();   // A 档：每次堆叠变化后补位加载可见卡图片与顶卡音频
}

/* ---------- A 档：按需图片加载 / 音频空闲预热 ---------- */
function attachFade(img, box) {
  if (!img) return;
  img.style.opacity = '0';
  const done = () => { img.style.opacity = '1'; if (box) box.classList.add('loaded'); };
  img.addEventListener('load', done);
  img.addEventListener('error', () => { img.style.opacity = '1'; if (box) box.classList.add('loaded'); });
  if (img.complete && img.naturalWidth > 0) done();   // 已缓存命中
}
function ensureImg(img) {
  if (!img || img.dataset.loaded) return;
  const url = img.dataset.src;
  if (!url) return;
  img.src = url;
  img.dataset.loaded = '1';
}
function preheatAudio(card) {
  if (!card || !card._audioPreheat) return;
  if ('requestIdleCallback' in window) requestIdleCallback(() => card._audioPreheat(), { timeout: 1500 });
  else setTimeout(() => card._audioPreheat(), 200);
}
function refreshImageWindow() {
  deck.forEach((heroIdx, pos) => {
    const card = cardEl(heroIdx);
    if (!card) return;
    const frontImg = card.querySelector('.tcg-img-bg img');
    if (pos < STACK) {                       // A1：仅所有可见卡（≤4）加载正面图，避免堆叠露出骨架
      ensureImg(frontImg);
      if (frontImg) frontImg.setAttribute('fetchpriority', pos === 0 ? 'high' : 'auto');
    }
    if (pos <= 1) {                          // A2：顶卡 + 紧挨顶卡共 2 张预载背面图，首屏即提前加载，切换更顺滑
      ensureImg(card.querySelector('.collect-img img'));
    }
    if (pos === 0) {                         // A4：仅顶卡（唯一可翻转/播放）空闲预热音频
      preheatAudio(card);
    }
  });
}

function isToolBtn(t) { return !!(t && t.closest && t.closest('.tool-btn')); }
function onDown(e) {
  if (locked) return;
  if (e.currentTarget.id !== topCardEl().id) return;   // 仅顶层卡可拖
  if (isToolBtn(e.target)) return;                      // 点 🔦/🔊 不触发拖拽与翻转
  dragging = true; moved = 0;
  startX = e.clientX; startY = e.clientY; dragX = 0; dragY = 0;
  const tc = topCardEl();
  tc.style.transition = 'none';
  tc.style.cursor = 'grabbing';
  try { tc.setPointerCapture(e.pointerId); } catch (_) {}
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function onMove(e) {
  if (!dragging) return;
  dragX = e.clientX - startX; dragY = e.clientY - startY;
  moved = Math.max(moved, Math.abs(dragX) + Math.abs(dragY));
  const tc = topCardEl();
  tc.style.transform = `translate(${dragX}px, ${dragY * 0.3}px) rotate(${dragX * 0.08}deg)`;
  const bp = tc.querySelector('.badge-prev'), bn = tc.querySelector('.badge-next');
  if (bp) bp.style.opacity = Math.max(0, Math.min(1, -dragX / THRESHOLD));
  if (bn) bn.style.opacity = Math.max(0, Math.min(1, dragX / THRESHOLD));
}
function onUp() {
  if (!dragging) return;
  dragging = false;
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup', onUp);
  const tc = topCardEl();
  if (Math.abs(dragX) > THRESHOLD) {
    swipe(dragX > 0 ? 'right' : 'left');
  } else if (moved < 8) {
    tc.classList.toggle('flipped');                  // 轻点 = 翻转
    tc.style.transition = 'transform 360ms cubic-bezier(0.34,1.4,0.64,1)';
    tc.style.transform = 'translateY(0) scale(1) rotate(0)';
  } else {
    tc.style.transition = 'transform 360ms cubic-bezier(0.34,1.4,0.64,1)';   // 回弹
    tc.style.transform = 'translateY(0) scale(1) rotate(0)';
  }
}
function swipe(dir) {
  if (locked) return;
  locked = true;
  const tc = topCardEl();
  const flyX = dir === 'left' ? -700 : 700;
  tc.style.transition = `transform ${FLY}ms ease-in, opacity ${FLY}ms ease-in`;
  tc.style.transform = `translate(${flyX}px, -60px) rotate(${dir === 'left' ? -28 : 28}deg)`;
  tc.style.opacity = '0';
  setTimeout(() => {
    deck.push(deck.shift());   // 顶部移到底部，牌堆循环
    applyStack();
    locked = false;
  }, FLY);
}

/* ---------- 模板渲染：按 JSON 生成所有卡片 ---------- */
function prefixIds(root, prefix) {
  root.querySelectorAll('[id]').forEach(el => { el.id = prefix + el.id; });
}
function renderCards() {
  const tpl = document.getElementById('cardTpl');
  stackArea.querySelectorAll('.flip-card').forEach(el => el.remove());  // 清空旧卡（保留静态 badge）
  dotsEl.innerHTML = '';
  HEROES.forEach((hero, i) => {
    const p = 'c' + (i + 1) + '_';
    const frag = tpl.content.cloneNode(true);
    const card = frag.querySelector('.flip-card');
    // 注意顺序：先查询（此时内部 id 尚未加前缀），再 prefixIds（卡片本身无 id，不会被二次加前缀），
    // 最后再单独设置 card.id，避免卡片 id 被重复加前缀导致 cardEl() 查找失败、applyStack 整体空转。
    const frontImg = frag.querySelector('#tcgFrontImg');
    const backImg = frag.querySelector('#collectBackImg');
    const frontBox = frag.querySelector('#tcgImgBg');
    const backBox = frag.querySelector('#collectImg');
    prefixIds(frag, p);                               // 内部 id 由 tcgNameCn → c1_tcgNameCn（卡片此时无 id，不受影响）
    card.id = p + 'flipCard';                        // prefixIds 之后再设卡片 id，确保 DOM 中恰为 'c1_flipCard'
    // A 档：图片不在此直接赋 src，改为写入 data-src，由 refreshImageWindow() 按需加载（见 applyStack）
    if (hero.fullbody_local) frontImg.dataset.src = resUrl(hero.fullbody_local);
    if (hero.babytype_local) backImg.dataset.src = resUrl(hero.babytype_local);
    frontImg.loading = 'lazy'; backImg.loading = 'lazy';   // 次要兜底
    attachFade(frontImg, frontBox);                  // A3：淡入 + 加载后隐藏骨架
    attachFade(backImg, backBox);
    stackArea.appendChild(frag);
    populateCard(hero, p);
    initSpotlight(p);
    initAudio(p, (hero.media && hero.media.audio) || [], card);
    card.addEventListener('pointerdown', onDown);
    const d = document.createElement('div');
    d.className = 'dot';
    dotsEl.appendChild(d);
  });
}

/* ---------- 启动：拉取后台 JSON 后再渲染 ---------- */
async function boot() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    HEROES = Array.isArray(data) ? data : (data.heroes || []);
  } catch (e) {
    // 可诊断化的失败提示：外网排障时能直接区分「网络不通 / CORS 拦截 / 混合内容拦截 / 404」
    console.error('加载 metainfo.json 失败：', e, '请求地址：', DATA_URL);
    const c = document.getElementById('counter');
    c.innerHTML = '数据加载失败'
      + '<div style="margin-top:10px;font-size:11px;color:#c66;letter-spacing:0;text-transform:none;line-height:1.7;max-width:88vw;word-break:break-all;">'
      + '请求地址：' + DATA_URL + '<br>'
      + '错误信息：' + (e && e.message ? e.message : e) + '<br>'
      + '排查：① 浏览器直接打开上面的地址看能否返回 JSON；② F12 控制台若报 CORS 需在服务端加 Access-Control-Allow-Origin；'
      + '③ 若报 mixed-content 说明 HTTPS 页面在加载 HTTP 资源；④ 可用 <b>?base=资源根地址</b> 临时切换后端。'
      + '</div>';
    return;
  }
  if (!HEROES.length) { document.getElementById('counter').textContent = '无数据'; return; }
  deck = HEROES.map((_, i) => i);
  renderCards();
  applyStack();
}

/* ---------- 初始化 ---------- */
dotsEl.addEventListener('click', e => {
  const i = [...dotsEl.children].indexOf(e.target);
  if (i < 0 || locked) return;
  while (deck[0] !== i) deck.push(deck.shift());
  applyStack();
});
boot();

</script>
</body>
